name: iLearn Task Checker

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 時間 0 點執行（台灣時間早上 8 點）
  workflow_dispatch:      # 允許你在 GitHub 網頁上手動點擊執行測試

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: 執行爬蟲程式
        env:
          ILEARN_USERNAME: ${{ secrets.ILEARN_USERNAME }}
          ILEARN_PASSWORD: ${{ secrets.ILEARN_PASSWORD }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py