name: iLearn Task Checker

on:
  workflow_dispatch: # 讓你可以手動點擊 Run
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 (台灣時間 8:00) 執行一次

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: 執行爬蟲程式
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ILEARN_USERNAME: ${{ secrets.ILEARN_USERNAME }}
          ILEARN_PASSWORD: ${{ secrets.ILEARN_PASSWORD }}
        run: |
          python main.py